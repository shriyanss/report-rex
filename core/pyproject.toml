[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "report-rex-core"
version = "0.1.0"
description = "Core transformation engine for Report Rex — Markdown to PDF pentest reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://shriyanss.github.io/report-rex/"
Repository = "https://github.com/shriyanss/report-rex"
Issues = "https://github.com/shriyanss/report-rex/issues"

[project.scripts]
report-rex = "report_rex_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/report_rex_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=report_rex_core --cov-report=term-missing"
