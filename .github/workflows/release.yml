name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  # Cross-compiles rex + rex-svr and creates the GitHub Release.
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # rex-presence isn't on the Marketplace; the release asset is its only channel.
  vsix:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli/editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vsce package -o .
      - run: gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # report-rex-core's version doesn't move in lockstep with version.txt, so
  # most releases re-publish an existing version — skip-existing covers that.
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build --outdir dist core/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
